name: Main

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 72 # 3 days
  # renovate: datasource=npm depName=corepack
  COREPACK_VERSION: 0.36.0

jobs:
  faency:
    name: Deploy
    if: github.repository == 'traefik/faency'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup safe-chain
        uses: ./.github/actions/setup-safe-chain

      - name: enable corepack
        run: |
          npm install -g corepack@${COREPACK_VERSION}
          corepack enable

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Config git
        run: |
          git config --local user.email "30906710+traefiker@users.noreply.github.com"
          git config --local user.name "traefiker"

      - name: Install dependencies
        env:
          NODE_ENV: production
        run: yarn workspaces focus --all && yarn patch-package

      - name: Build Storybook
        env:
          NODE_ENV: production
        run: yarn build-storybook

      # Artifacts are scoped to the run, not the attempt: a re-run would otherwise
      # find the previous attempt's artifact too and deploy-pages would refuse.
      - name: Upload Storybook
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: storybook-static
          name: github-pages-${{ github.run_attempt }}

      # The artifact is sometimes not listed yet right after upload, so retry once.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy to GitHub Pages
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
