name: Main

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 72 # 3 days
  # renovate: datasource=npm depName=corepack
  COREPACK_VERSION: 0.36.0

jobs:
  faency:
    name: Deploy
    if: github.repository == 'traefik/faency'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup safe-chain
        uses: ./.github/actions/setup-safe-chain

      - name: enable corepack
        run: |
          npm install -g corepack@${COREPACK_VERSION}
          corepack enable

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Config git
        run: |
          git config --local user.email "30906710+traefiker@users.noreply.github.com"
          git config --local user.name "traefiker"

      - name: Deploy
        uses: bitovi/github-actions-storybook-to-github-pages@ddd9d35f670cceedd2bfc444be681001b0709730 # v1.0.4
        env:
          NODE_ENV: production
        with:
          install_command: yarn workspaces focus --all && yarn patch-package
          build_command: yarn build-storybook
          path: storybook-static
          checkout: false
